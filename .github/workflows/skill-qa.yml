name: Skill QA

on:
  pull_request:
    paths:
      - "skills/**"
      - "disabled_skills/**"
      - ".github/workflows/skill-qa.yml"
  push:
    paths:
      - "skills/**"
      - "disabled_skills/**"
      - ".github/workflows/skill-qa.yml"

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run validator tests
        run: python3 skills/skill-qa-gate/scripts/test_lint_skill.py
      - name: Find and validate changed Skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t skill_dirs < <(find skills disabled_skills -mindepth 1 -maxdepth 1 -type d | sort)
          else
            mapfile -t skill_dirs < <(
              git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- skills disabled_skills |
              awk -F/ '/^(skills|disabled_skills)\/[^/]+\// {print $1 "/" $2}' |
              sort -u
            )
          fi

          if (( ${#skill_dirs[@]} == 0 )); then
            echo "No changed Skills to validate."
            exit 0
          fi

          python3 skills/skill-qa-gate/scripts/lint_skill.py "${skill_dirs[@]}"
